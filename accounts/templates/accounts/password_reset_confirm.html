{% extends 'base.html' %}
{% block content %}
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm p-4">
                <h1 class="h4 text-center mb-3">Imposta Nuova Password</h1>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Codice di verifica</label>
                        {{ form.code }}
                        {% if form.code.errors %}
                            <div class="text-danger small mt-1">{{ form.code.errors.0 }}</div>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nuova Password</label>
                        {{ form.password1 }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Conferma Password</label>
                        {{ form.password2 }}
                        {% if form.non_field_errors %}
                            <div class="text-danger small mt-1">{{ form.non_field_errors.0 }}</div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-success w-100">Aggiorna Password</button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
