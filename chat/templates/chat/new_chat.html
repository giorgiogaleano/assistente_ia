{% extends 'base.html' %}

{% block content %}
<div class="d-flex">
    {% include './sidebar.html' %}

    <!-- area Principale del Contenuto (Spostata a destra di 280px per la sidebar fissa) -->
    <main class="flex-grow-1 p-4" style="margin-left: 280px;">
        <div class="container-fluid min-vh-100 d-flex flex-column justify-content-center align-items-center text-center">
            
            <!-- schermata di benvenuto in stile Gemini -->
            <div class="mb-5">
                <h1 class="display-5 fw-bold text-light mb-3">Ciao, {{ request.user.username }}</h1>
                <p class="lead text-muted">Come posso aiutarti oggi?</p>
            </div>

            <!-- Placeholder per il box di input del messaggio (lo svilupperemo dopo) -->
            <div class="w-100" style="max-width: 750px;">
                <div class="card shadow-sm border-1 rounded-4 p-2">
                    <div class="card-body d-flex align-items-center">
                        <input type="text" class="form-control border-0 shadow-none fs-5" placeholder="Chiedi a Gemini..." readonly>
                        <button class="btn btn-primary rounded-circle ms-2" disabled>
                            <i class="bi bi-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>
{% endblock %}
